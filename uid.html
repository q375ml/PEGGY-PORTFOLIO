    <script>
      $('.back-top').on('click', function (event) {
        event.preventDefault();
        $('html, body').animate({ scrollTop: 0 }, 1200);
      });
      $(window)
        .on('scroll', function () {
          if ($(this).scrollTop() >= 150) $('.back-top').fadeIn();
          else $('.back-top').fadeOut();
        })
        .scroll();
    </script>
  
    <!-- CTA click tracking (GA4) -->
    <script>
      document.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest || typeof gtag !== 'function') return;
        var a = t.closest('a');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        var label = (a.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100);

        if (href.indexOf('mailto:') === 0) {
          gtag('event', 'contact_email_click', {
            link_text: label,
            link_url: href,
            page_path: location.pathname
          });
          return;
        }

        var cls = (typeof a.className === 'string') ? a.className : '';
        if (cls.indexOf('bt_blue') !== -1 && href && !/\.pdf($|\?)/i.test(href)) {
          gtag('event', 'view_project_click', {
            link_text: label,
            project: href.split('/').pop().replace(/\.html$/i, ''),
            page_path: location.pathname
          });
        }
      }, true);
    </script>
